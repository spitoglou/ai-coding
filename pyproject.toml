[project]
name = "ai-coding"
version = "0.3.0"
description = ""
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_coding"]

[tool.uv]
dev-dependencies = [
    "commitizen>=4.11.2",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
update_changelog_on_bump = true
# .claude/VERSION is the core version install.py stamps into consumer projects,
# so it must move with the release or every install misreports what it shipped.
version_files = [".claude/VERSION"]
